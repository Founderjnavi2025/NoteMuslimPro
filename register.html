<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06140f" />
  <title>Daftar — Amal Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap container">
    <div class="brand">
      <div class="brand-logo">☪</div>
      <h1 class="brand-title">Daftar</h1>
      <p class="brand-subtitle">Mulai perjalanan evaluasi diri</p>
    </div>

    <div class="card auth-card">
      <div class="alert alert-error" id="errorBox"></div>
      <div class="alert alert-success" id="successBox"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="displayName">Nama Tampilan</label>
          <input type="text" id="displayName" autocomplete="name" required placeholder="Nama Anda" maxlength="60" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="nama@email.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" required placeholder="Minimal 6 karakter" minlength="6" />
        </div>
        <div class="field">
          <label for="confirmPassword">Konfirmasi Password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" required placeholder="Ulangi password" minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Daftar</button>
      </form>

      <hr class="hr" />

      <p class="text-center text-muted" style="font-size:0.85rem">
        Sudah punya akun? <a href="login.html">Masuk</a>
      </p>
    </div>

    <p class="text-center mt-3"><a href="index.html" class="text-muted" style="font-size:0.8rem">← Kembali</a></p>
  </div>

  <script type="module">
    import { signUp, redirectIfAuthed } from './js/auth.js';

    redirectIfAuthed();

    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    const showError = (m) => { errorBox.textContent = m; errorBox.classList.add('show'); successBox.classList.remove('show'); };
    const showSuccess = (m) => { successBox.textContent = m; successBox.classList.add('show'); errorBox.classList.remove('show'); };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      successBox.classList.remove('show');

      const displayName = form.displayName.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;

      if (!displayName) return showError('Nama tampilan wajib diisi.');
      if (!email) return showError('Email wajib diisi.');
      if (password.length < 6) return showError('Password minimal 6 karakter.');
      if (password !== confirmPassword) return showError('Konfirmasi password tidak cocok.');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses…';

      try {
        const data = await signUp({ email, password, displayName });
        if (data.user && !data.session) {
          showSuccess('Pendaftaran berhasil. Cek email Anda untuk konfirmasi sebelum masuk.');
          form.reset();
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        showError(err.message || 'Gagal mendaftar.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
      }
    });
  </script>
</body>
</html>
